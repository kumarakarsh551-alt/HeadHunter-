name: Build Forge 1.20.1 Mod

on:
  push:
    branches: [ main, master, "1.20.1" ]
  pull_request:
    branches: [ main, master, "1.20.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Mod JAR
        run: ./gradlew build

      - name: Upload Mod Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: forge-1.20.1-mod-jars
          path: |
            build/libs/*.jar
            !build/libs/*-all.jar
            !build/libs/*-slim.jar
            
