plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'net.shadow.headhuntermod'
version = project.mod_version
base { archivesName = 'HeadhunterMod-1_20_1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } } }
        server { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } } }
    }
}

repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_version: mod_version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand(['file': ['jarVersion': mod_version]]) }
}

tasks.named('jar', Jar).configure {
    manifest.attributes(['Specification-Title': mod_id, 'Implementation-Version': mod_version])
    finalizedBy 'reobfJar'
}
